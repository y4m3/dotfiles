# herdr configuration: overrides only. For the full set of keys and their
# defaults, run `herdr --default-config`.

onboarding = false

[theme]
name = "terminal"

[theme.custom]
# Tracer mapping carried over from the tuned 0.7.4 setup.
# accent: calmed deep green for highlights and the active frame.
accent = "#4E9E76"
# Panels share the terminal background so the sidebar does not float.
panel_bg = "reset"
# Surfaces: bg -> raised, in brightness steps.
surface_dim = "#14201C"
surface0 = "#23362F"
surface1 = "#3C4C44"
# Text: body -> muted, in darkness steps.
text = "#B8C7BC"
subtext0 = "#A7B5AA"
overlay1 = "#7E9187"
# Low because agent labels get an explicit fg in [ui.sidebar.agents].
overlay0 = "#46564D"
# State colors: green/cyan base, warm hues reserved for warnings.
green = "#4CE896"
yellow = "#D8E85A"
red = "#F0556E"
blue = "#4FB0E8"
teal = "#3FE0D8"
mauve = "#A97FE8"
peach = "#E89A52"

[keys]
prefix = "ctrl+g"
previous_workspace = "prefix+shift+k"
next_workspace = "prefix+shift+j"
previous_agent = "prefix+shift+h"
next_agent = "prefix+shift+l"
split_horizontal = "prefix+s"
settings = "prefix+shift+s"

[ui]
# Borderless panes: separated by a one-cell gap instead of drawn borders.
pane_borders = false
pane_gaps = true

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  [{ token = "agent", fg = "#A7B5AA", dim = false }],
]

[ui.toast]
delivery = "terminal"
