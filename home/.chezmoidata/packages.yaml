---
# Single source of truth for installed tools.
# - packages.nix.* groups render into ~/.config/nix/home.nix (Home Manager)
# - packages.apt renders into the apt bootstrap script
#
# Selection principle (agent-age): a tool earns its place only if it serves
# driving agents, inspecting their output, or intervening by hand.
# Pull-based: start minimal. Add a line here when a real need appears.
# Project-specific toolchains (linters, formatters, language servers) belong
# in each project's dev environment, not here.
#
# Claude Code itself is NOT here:
# .chezmoiscripts/run_once_040-linux-claude-code.sh.tmpl bootstraps it once.
# Then it keeps itself up to date (native auto-updater).
# chezmoi is NOT here either. install.sh puts it in ~/.local/bin, which
# shadows any Nix copy. This repo uses one supplier, so this file
# excludes chezmoi.
# mo (markdown viewer, inspect) is not in nixpkgs: pinned by
# .chezmoiscripts/run_onchange_050-linux-mo.sh.tmpl with checksum.
packages:
  nix:
    cockpit:
      - tmux  # fallback multiplexer (herdr comes via flake input)
    inspect:
      - bat
      - btop
      - delta
      - eza
      - fd
      - fzf
      - gh
      - ghq
      - git
      - jq
      - ripgrep
    intervene:
      - neovim
      # LSP/format/lint binaries for nvim (nvim disables Mason; Nix supplies
      # all).
      # Python: Astral stack — ty (types/LSP) + ruff; pyright available as
      # needed via `uvx pyright` for independent checks.
      # lua LSP (lazydev needs it; LazyVim config is built in)
      - lua-language-server
      - markdown-toc
      - markdownlint-cli2
      - marksman
      - prettier
      - ruff
      - sqlfluff
      - stylua  # lua formatter (conform default for the nvim config itself)
      - taplo  # TOML LSP (chezmoi config, herdr config)
      # CLI required by nvim-treesitter (main branch) to build parsers
      - tree-sitter
      - ty
      - uv
      - yamllint  # guards packages.yaml edits
    shell:
      - direnv
      - zoxide
    selfcare:
      - shellcheck
      - shfmt
  # Windows apps (winget IDs). This is intentionally minimal: Windows only
  # needs to reach WSL — a terminal, git (git-bash for Claude Code's Bash
  # tool), and a shell. Development tools live in WSL.
  winget:
    - Git.Git
    - Microsoft.PowerShell
    - wez.wezterm
    # nvim on Windows: editor, C compiler (treesitter parser builds),
    # pickers/git UI (fd/rg, fzf, lazygit), the tree-sitter CLI (parser
    # builds), shfmt (conform), and node (node-dependent plugins). Also
    # carries the LSP servers and formatters Nix supplies on Linux
    # (marksman, stylua, lua-language-server, taplo), plus uv as the
    # supplier for Python tools (ruff, sqlfluff, ty via packages.uv).
    - Artempyanykh.Marksman
    - astral-sh.uv
    - BrechtSanders.WinLibs.POSIX.UCRT
    - BurntSushi.ripgrep.MSVC
    - JesseDuffield.lazygit
    - JohnnyMorganz.StyLua
    - junegunn.fzf
    - LuaLS.lua-language-server
    - mvdan.shfmt
    - Neovim.Neovim
    - OpenJS.NodeJS.LTS
    - sharkdp.fd
    - tamasfe.taplo
    - tree-sitter.tree-sitter-cli
    # Inspect tools shared with the Linux layer.
    - dandavison.delta
    - eza-community.eza
    - sharkdp.bat
    # Daily inspect tools shared with the Linux layer; less is delta's pager.
    - aristocratos.btop4win
    - GitHub.cli
    - jftuga.less
    - jqlang.jq
    # shellcheck. It pairs with shfmt. Both run in the repo's ./lint script.
    - koalaman.shellcheck
    - x-motemen.ghq
    # Shell navigation for the pwsh side.
    - ajeetdsouza.zoxide
  # Consumed ONLY by run_onchange_120-windows-npm-tools.ps1.tmpl. On Linux,
  # Nix supplies the same tools (see packages.nix.intervene above).
  npm:
    - markdown-toc
    - markdownlint-cli2
    - prettier
  # Consumed ONLY by run_onchange_130-windows-uv-tools.ps1.tmpl. On Linux,
  # Nix supplies the same tools (see packages.nix.intervene above).
  uv:
    - ruff
    - sqlfluff
    - ty
  # Consumed ONLY by run_onchange_140-windows-psgallery.ps1.tmpl (PSReadLine
  # key chords for fzf).
  psgallery:
    - PSFzf
  apt:
    - bash-completion
    - build-essential
    - ca-certificates
    - curl
    - unzip  # win32yank bootstrap
